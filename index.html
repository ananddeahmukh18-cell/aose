<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOSE | Timeless Elegance</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --primary: #0f3d2e;
            --accent: #c6a664;
            --text-dark: #1c1c1c;
            --text-light: #666666;
            --border: #e5e5e5;
            --font-main: 'Montserrat', sans-serif;
            --font-head: 'Playfair Display', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-main); color: var(--text-dark); background: #fff; overflow-x: hidden; }

        /* HEADER */
        header {
            position: sticky; top: 0; z-index: 1000; background: #fff;
            border-bottom: 1px solid var(--border); padding: 15px 40px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo img { height: 50px; }
        .nav-actions { display: flex; gap: 20px; align-items: center; }
        .cart-trigger { position: relative; cursor: pointer; color: var(--primary); font-size: 1.2rem; }
        .cart-count {
            position: absolute; top: -8px; right: -10px; background: var(--accent);
            color: white; font-size: 10px; padding: 2px 6px; border-radius: 50%;
        }

        /* HERO */
        .hero {
            height: 75vh; background: url('demo.png') center/cover;
            display: flex; align-items: center; justify-content: center; position: relative;
        }
        .hero-overlay { position: absolute; inset: 0; background: rgba(15, 61, 46, 0.3); }
        .hero-content { position: relative; z-index: 2; text-align: center; color: white; }
        .hero-content h1 { font-family: var(--font-head); font-size: 3.5rem; margin-bottom: 10px; }

        /* TOOLBAR (Filter & Search) */
        .toolbar { padding: 30px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 20px; }
        .categories button {
            background: none; border: 1px solid var(--border); padding: 8px 20px; 
            cursor: pointer; transition: 0.3s; margin-right: 5px; font-family: var(--font-main);
        }
        .categories button.active { border-color: var(--primary); color: var(--primary); font-weight: bold; }
        .search-container { position: relative; width: 300px; }
        .search-container input { width: 100%; padding: 10px; border: 1px solid var(--border); }

        /* PRODUCT GRID */
        .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 40px; }
        
        .card { background: white; transition: 0.3s; position: relative; text-align: center; }
        .card-img-wrap { position: relative; height: 400px; overflow: hidden; background: #f4f4f4; }
        .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .sold-out-badge { position: absolute; top: 15px; left: 15px; background: #000; color: #fff; padding: 5px 10px; font-size: 11px; font-weight: bold; z-index: 2; }

        .card-details { padding: 20px 0; }
        .card-price { color: var(--accent); font-weight: 700; margin-bottom: 15px; }

        /* SIZE & QTY */
        .size-options { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; }
        .size-btn {
            width: 38px; height: 38px; border: 1px solid var(--border); 
            display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px;
        }
        .size-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .size-btn.disabled { color: #ccc; text-decoration: line-through; cursor: not-allowed; }

        .qty-wrapper { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 15px; }
        .qty-btn { width: 30px; height: 30px; border: 1px solid var(--border); background: #fff; cursor: pointer; }

        .add-btn {
            width: 100%; padding: 15px; background: var(--text-dark); color: white;
            border: none; text-transform: uppercase; letter-spacing: 2px; cursor: pointer;
        }
        .add-btn:hover { background: var(--accent); }
        .btn-disabled { background: #ccc !important; cursor: not-allowed; }

        /* SIDEBAR & MODAL */
        .sidebar { position: fixed; top: 0; right: -450px; width: 400px; height: 100vh; background: white; z-index: 2001; transition: 0.4s; display: flex; flex-direction: column; box-shadow: -5px 0 20px rgba(0,0,0,0.1); }
        .sidebar.open { right: 0; }
        .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; display: none; }
        .cart-items { flex: 1; overflow-y: auto; padding: 20px; }
        .cart-item { display: flex; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .cart-item img { width: 70px; height: 90px; object-fit: cover; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; align-items: center; justify-content: center; }
        .modal-box { background: white; width: 90%; max-width: 500px; padding: 30px; position: relative; }

        footer { background: #111; color: white; padding: 60px 40px; text-align: center; }
        .footer-logo { height: 50px; filter: brightness(0) invert(1); margin-bottom: 20px; }

        @media(max-width: 768px) { .sidebar { width: 100%; } .grid { grid-template-columns: 1fr 1fr; gap: 15px; } }
    </style>
</head>
<body>

    <header>
        <div class="logo"><img src="aose ad.png" alt="AOSE"></div>
        <div class="nav-actions">
            <a href="https://wa.me/917887731818" target="_blank"><i class="fab fa-whatsapp"></i></a>
            <div class="cart-trigger" onclick="toggleCart()">
                <i class="fas fa-shopping-bag"></i>
                <span class="cart-count" id="cart-count">0</span>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1>Elegance Reimagined</h1>
            <p>Timeless style for the modern legacy</p>
        </div>
    </section>

    <section class="toolbar">
        <div class="categories">
            <button class="active" onclick="filterItems('all', this)">All</button>
            <button onclick="filterItems('hoodies', this)">Hoodies</button>
            <button onclick="filterItems('shirts', this)">Shirts</button>
        </div>
        <div class="search-container">
            <input type="text" id="searchBox" placeholder="Search collection..." onkeyup="searchItems()">
        </div>
    </section>

    <div class="container">
        <div id="product-grid" class="grid"></div>
    </div>

    <footer>
        <img src="aose ad.png" class="footer-logo">
        <p>© 2025 AOSE CLOTHING. All Rights Reserved.</p>
    </footer>

    <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
    <div class="sidebar" id="sidebar">
        <div style="padding:20px; border-bottom:1px solid #eee; display:flex; justify-content:space-between;">
            <h3>Your Bag</h3>
            <i class="fas fa-times" onclick="toggleCart()" style="cursor:pointer"></i>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div style="padding:20px; background:#f9f9f9;">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px; font-weight:bold;">
                <span>Total</span><span>₹<span id="cart-total">0</span></span>
            </div>
            <button class="add-btn" onclick="openCheckout()">Checkout</button>
        </div>
    </div>

    <div class="modal" id="checkout-modal">
        <div class="modal-box">
            <i class="fas fa-times" style="position:absolute; top:20px; right:20px; cursor:pointer;" onclick="closeModal()"></i>
            <div id="step-1">
                <h3>Shipping Details</h3>
                <input type="text" id="c-name" placeholder="Full Name" style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd;">
                <input type="tel" id="c-phone" placeholder="WhatsApp Number" style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd;">
                <textarea id="c-address" placeholder="Full Address" style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd;" rows="3"></textarea>
                <button class="add-btn" onclick="showPayment()">Proceed to Pay</button>
            </div>
            <div id="step-2" style="display:none; text-align:center;">
                <h3>Scan to Pay</h3>
                <div id="qrcode" style="margin:20px 0;"></div>
                <p>Amount: ₹<span id="pay-amt"></span></p>
                <button class="add-btn" style="background:#25d366; margin-top:20px;" onclick="finishOrder()">Confirm on WhatsApp</button>
            </div>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Signature Green Hoodie", cat: "hoodies", price: 2499, img: "hoodie-stack.jpg", stock: { S: 5, M: 0, L: 10, XL: 2 } },
            { id: 2, name: "Premium Beige Hoodie", cat: "hoodies", price: 2499, img: "demo.png", stock: { S: 10, M: 10, L: 10, XL: 10 } },
            { id: 3, name: "Classical Motif Shirt", cat: "shirts", price: 1899, img: "shirt-pattern.jpg", stock: { S: 2, M: 4, L: 0, XL: 5 } },
            { id: 4, name: "Azure Pinstripe Shirt", cat: "shirts", price: 1699, img: "shirt-blue.jpg", stock: { S: 8, M: 8, L: 8, XL: 8 } },
            { id: 5, name: "Rose Vertical Stripe", cat: "shirts", price: 1699, img: "shirt-pink.jpg", stock: { S: 0, M: 0, L: 0, XL: 0 } }
        ];

        let cart = JSON.parse(localStorage.getItem('aoseCart')) || [];
        let selections = {};

        function render(list) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = list.map(p => {
                const isSoldOut = Object.values(p.stock).reduce((a, b) => a + b, 0) === 0;
                selections[p.id] = { size: null, qty: 1 };
                return `
                <div class="card">
                    <div class="card-img-wrap">
                        ${isSoldOut ? '<span class="sold-out-badge">SOLD OUT</span>' : ''}
                        <img src="${p.img}" onerror="this.src='https://via.placeholder.com/400'">
                    </div>
                    <div class="card-details">
                        <h4>${p.name}</h4>
                        <div class="card-price">₹${p.price}</div>
                        ${!isSoldOut ? `
                            <div class="size-options" id="sizes-${p.id}">
                                ${Object.keys(p.stock).map(s => `<div class="size-btn ${p.stock[s] === 0 ? 'disabled' : ''}" onclick="selectSize(${p.id}, '${s}', ${p.stock[s]})">${s}</div>`).join('')}
                            </div>
                            <div class="qty-wrapper">
                                <button class="qty-btn" onclick="changeQty(${p.id}, -1)">-</button>
                                <span id="qty-${p.id}">1</span>
                                <button class="qty-btn" onclick="changeQty(${p.id}, 1)">+</button>
                            </div>
                            <button class="add-btn" onclick="addToCart(${p.id})">Add to Bag</button>
                        ` : '<button class="add-btn btn-disabled" disabled>Out of Stock</button>'}
                    </div>
                </div>`;
            }).join('');
        }

        function selectSize(pid, size, stock) {
            if (stock === 0) return;
            document.querySelectorAll(`#sizes-${pid} .size-btn`).forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            selections[pid].size = size;
        }

        function changeQty(pid, val) {
            let n = selections[pid].qty + val;
            if (n < 1) n = 1;
            selections[pid].qty = n;
            document.getElementById(`qty-${pid}`).innerText = n;
        }

        function addToCart(pid) {
            const sel = selections[pid];
            if (!sel.size) return alert("Select a size");
            const p = products.find(x => x.id === pid);
            cart.push({ ...p, selectedSize: sel.size, selectedQty: sel.qty });
            updateCart();
            toggleCart();
        }

        function updateCart() {
            localStorage.setItem('aoseCart', JSON.stringify(cart));
            document.getElementById('cart-count').innerText = cart.length;
            let total = 0;
            document.getElementById('cart-items').innerHTML = cart.map((item, i) => {
                total += (item.price * item.selectedQty);
                return `<div class="cart-item">
                    <img src="${item.img}">
                    <div style="flex:1">
                        <p style="font-weight:600">${item.name}</p>
                        <p style="font-size:12px">Size: ${item.selectedSize} | Qty: ${item.selectedQty}</p>
                        <p>₹${item.price * item.selectedQty}</p>
                    </div>
                    <i class="fas fa-trash" onclick="cart.splice(${i},1); updateCart();"></i>
                </div>`;
            }).join('');
            document.getElementById('cart-total').innerText = total;
        }

        function toggleCart() {
            document.getElementById('sidebar').classList.toggle('open');
            const overlay = document.getElementById('cart-overlay');
            overlay.style.display = overlay.style.display === 'block' ? 'none' : 'block';
        }

        function filterItems(cat, btn) {
            document.querySelectorAll('.categories button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render(cat === 'all' ? products : products.filter(p => p.cat === cat));
        }

        function searchItems() {
            const term = document.getElementById('searchBox').value.toLowerCase();
            render(products.filter(p => p.name.toLowerCase().includes(term)));
        }

        function openCheckout() {
            if (!cart.length) return;
            toggleCart();
            document.getElementById('checkout-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('checkout-modal').style.display = 'none'; }

        function showPayment() {
            const total = document.getElementById('cart-total').innerText;
            document.getElementById('pay-amt').innerText = total;
            document.getElementById('step-1').style.display = 'none';
            document.getElementById('step-2').style.display = 'block';
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: `upi://pay?pa=7887731818@ybl&pn=AOSE&am=${total}&cu=INR`, width: 150, height: 150 });
        }

        function finishOrder() {
            const name = document.getElementById('c-name').value;
            const items = cart.map(i => `${i.name} (${i.selectedSize}) x${i.selectedQty}`).join(", ");
            const msg = `*NEW ORDER*%0A*Name:* ${name}%0A*Items:* ${items}%0A*Total:* ₹${document.getElementById('cart-total').innerText}`;
            window.open(`https://wa.me/917887731818?text=${msg}`);
            cart = []; updateCart(); location.reload();
        }

        render(products);
        updateCart();
    </script>
</body>
</html>
