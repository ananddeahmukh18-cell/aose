<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOSE | Premium Clothing</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        :root {
            --primary: #0f3d2e; --accent: #c6a664; --cream: #f8f4ec; --white: #fff;
            --shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: var(--cream); overflow-x: hidden; scroll-behavior: smooth; }

        /* Header & Nav */
        .header { position: fixed; top: 0; width: 100%; z-index: 1000; background: rgba(255,255,255,0.95); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); }
        .logo { font-family: 'Playfair Display'; font-size: 1.8rem; font-weight: 800; color: var(--primary); }
        .nav-btns { display: flex; gap: 1rem; align-items: center; }
        .btn { padding: 0.6rem 1.2rem; border-radius: 50px; border: 2px solid var(--primary); background: none; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .btn:hover { background: var(--primary); color: white; }
        .cart-btn { font-size: 1.5rem; position: relative; cursor: pointer; color: var(--primary); }
        .badge { position: absolute; top: -8px; right: -8px; background: var(--primary); color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 50%; }

        /* Hero */
        .hero { height: 80vh; display: flex; align-items: center; justify-content: center; text-align: center; background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=2070') center/cover; color: white; margin-top: 60px; }
        .hero h1 { font-family: 'Playfair Display'; font-size: 3.5rem; }

        /* Products Grid */
        .section { padding: 4rem 5%; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; margin-top: 2rem; }
        .card { background: white; padding: 1rem; border-radius: 15px; box-shadow: var(--shadow); transition: 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 300px; object-fit: cover; border-radius: 10px; }
        .sizes { display: flex; justify-content: center; gap: 5px; margin: 10px 0; }
        .size-btn { padding: 5px 10px; border: 1px solid #ddd; cursor: pointer; background: white; border-radius: 4px; }
        .size-btn.active { background: var(--primary); color: white; }

        /* Cart Sidebar */
        #cartSidebar { position: fixed; right: -400px; top: 0; width: 400px; height: 100%; background: white; z-index: 1100; transition: 0.3s; padding: 2rem; box-shadow: -5px 0 15px rgba(0,0,0,0.1); }
        #cartSidebar.open { right: 0; }
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 1rem; border-bottom: 1px solid #eee; padding-bottom: 0.5rem; }

        /* Modal */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2000; align-items:center; justify-content:center; }
        .modal-content { background:white; padding:2rem; border-radius:15px; width:90%; max-width:400px; position:relative; }
        .close { position:absolute; right:15px; top:10px; cursor:pointer; font-size:1.5rem; }
        
        @media (max-width: 600px) { #cartSidebar { width: 100%; } .hero h1 { font-size: 2rem; } }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">AOSE</div>
        <div class="nav-btns">
            <button class="btn" onclick="document.getElementById('products').scrollIntoView()">SHOP</button>
            <div class="cart-btn" onclick="toggleCart()">
                <i class="fas fa-shopping-bag"></i>
                <span class="badge" id="cartCount">0</span>
            </div>
        </div>
    </header>

    <section class="hero">
        <div>
            <h1>TIMELESS ELEGANCE</h1>
            <p>Premium Stitch & Wear Clothing</p>
        </div>
    </section>

    <section class="section" id="products">
        <h2>Premium Collection</h2>
        <div class="grid" id="productsGrid"></div>
    </section>

    <div id="cartSidebar">
        <h3>Your Bag <span onclick="toggleCart()" style="float:right; cursor:pointer;">&times;</span></h3>
        <hr><br>
        <div id="cartItems"></div>
        <div style="margin-top:2rem;">
            <h4>Total: ₹<span id="cartTotal">0</span></h4><br>
            <button class="btn" style="width:100%;" onclick="openCheckout()">CHECKOUT</button>
        </div>
    </div>

    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h3>Checkout</h3><br>
            <input type="text" id="custName" placeholder="Full Name" style="width:100%; padding:10px; margin-bottom:10px;">
            <input type="text" id="custPhone" placeholder="Phone Number" style="width:100%; padding:10px; margin-bottom:10px;">
            <div id="qrcode" style="display:flex; justify-content:center; margin:15px 0;"></div>
            <p style="font-size:0.8rem; color:gray; text-align:center;">Scan to pay & Share Screenshot on WhatsApp</p><br>
            <button class="btn" style="width:100%; background:var(--primary); color:white;" onclick="completeOrder()">CONFIRM ORDER</button>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Signature White Kurta", price: 2499, img: "https://images.unsplash.com/photo-1597983073493-88cd35cf93b0?q=80&w=1000" },
            { id: 2, name: "Royal Green Sherwani", price: 5999, img: "https://images.unsplash.com/photo-1598559069352-3d8437b0d42c?q=80&w=1000" },
            { id: 3, name: "Classic Cotton Shirt", price: 1899, img: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?q=80&w=1000" }
        ];

        let cart = [];

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = products.map(p => `
                <div class="card">
                    <img src="${p.img}" alt="${p.name}">
                    <h4>${p.name}</h4>
                    <p>₹${p.price}</p>
                    <div class="sizes">
                        ${['S','M','L','XL'].map(s => `<button class="size-btn" onclick="selectSize(this)">${s}</button>`).join('')}
                    </div>
                    <button class="btn" onclick="addToCart(${p.id})">Add to Bag</button>
                </div>
            `).join('');
        }

        function selectSize(btn) {
            btn.parentElement.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function toggleCart() {
            document.getElementById('cartSidebar').classList.toggle('open');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            updateCart();
            alert("Added to bag!");
        }

        function updateCart() {
            document.getElementById('cartCount').innerText = cart.length;
            const container = document.getElementById('cartItems');
            let total = 0;
            container.innerHTML = cart.map((item, idx) => {
                total += item.price;
                return `<div class="cart-item"><span>${item.name}</span><b>₹${item.price}</b></div>`;
            }).join('');
            document.getElementById('cartTotal').innerText = total;
        }

        function openCheckout() {
            if(cart.length === 0) return alert("Bag is empty");
            document.getElementById('checkoutModal').style.display = 'flex';
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: "upi://pay?pa=YOURUPIID@okicici&pn=AOSE&am=" + document.getElementById('cartTotal').innerText,
                width: 150, height: 150
            });
        }

        function closeModal() { document.getElementById('checkoutModal').style.display = 'none'; }

        function completeOrder() {
            const name = document.getElementById('custName').value;
            if(!name) return alert("Enter details");
            alert("Order Requested! Redirecting to WhatsApp...");
            window.location.href = `https://wa.me/YOUR_PHONE_NUMBER?text=New Order from ${name}. Total: ₹${document.getElementById('cartTotal').innerText}`;
        }

        renderProducts();
    </script>
</body>
</html>
