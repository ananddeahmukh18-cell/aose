<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOSE | Timeless Elegance, Modern Legacy</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Essential Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --primary: #0f3d2e;
            --accent-gold: #c6a664;
            --bg-cream: #EEE0C4;
            --white: #ffffff;
            --shadow-light: rgba(0,0,0,0.08);
            --shadow-medium: rgba(0,0,0,0.15);
            --shadow-glow: rgba(15,61,46,0.3);
            --font-main: 'Montserrat', sans-serif;
            --font-display: 'Playfair Display', serif;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body { 
            font-family: var(--font-main); 
            background: linear-gradient(135deg, var(--bg-cream) 0%, #f5e7c9 50%, #e8d9b2 100%); 
            color: #1a1a1a; 
            overflow-x: hidden;
            min-height: 100vh;
            perspective: 1000px;
        }

        /* ✨ LOADING ANIMATION */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary), var(--accent-gold));
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease-out;
        }
        .loading.hidden { opacity: 0; pointer-events: none; }
        .loader {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid var(--white);
            border-radius: 50%;
            animation: spin 1s linear infinite, glow 2s ease-in-out infinite alternate;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes glow { 0% { box-shadow: 0 0 20px var(--white); } 100% { box-shadow: 0 0 40px var(--accent-gold); } }

        /* === HEADER === */
        header {
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px) saturate(180%);
            padding: 1rem 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            box-shadow: 0 8px 32px var(--shadow-light);
            transform: translateY(-100%);
            animation: slideDown 1s 0.5s ease-out forwards;
        }
        @keyframes slideDown {
            to { transform: translateY(0); }
        }
        .brand-logo-area { 
            display: flex; 
            align-items: center; 
            gap: 1rem;
            background: rgba(255,255,255,0.9);
            padding: 0.8rem 1.5rem;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px var(--shadow-light);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .brand-logo-area:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 20px 40px var(--shadow-medium);
        }
        .brand-logo-area img { 
            height: 55px; 
            border-radius: 15px; 
            object-fit: contain;
            transition: transform 0.3s ease;
        }
        .brand-logo-area:hover img { transform: rotateY(10deg) scale(1.05); }
        .logo-text { 
            font-family: var(--font-display); 
            font-size: 2.2rem; 
            background: linear-gradient(135deg, var(--primary), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px; 
            font-weight: 800;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }

        .nav-right { 
            display: flex; 
            gap: 1.5rem; 
            align-items: center; 
        }
        .btn-track, .btn-admin { 
            font-size: 0.85rem; 
            font-weight: 700; 
            padding: 0.8rem 2rem; 
            border: 2px solid transparent;
            background: linear-gradient(var(--white), var(--white)) padding-box,
                        linear-gradient(135deg, var(--primary), var(--accent-gold)) border-box;
            cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            overflow: hidden;
        }
        .btn-track::before, .btn-admin::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s;
        }
        .btn-track:hover::before, .btn-admin:hover::before { left: 100%; }
        .btn-track:hover, .btn-admin:hover { 
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 15px 35px var(--shadow-glow);
        }
        .btn-admin { 
            display: none; 
            opacity: 0;
            animation: fadeIn 0.6s ease-out forwards;
        }
        .btn-admin.show { 
            display: inline-flex !important; 
            opacity: 1;
            animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        .cart-icon { 
            position: relative; 
            cursor: pointer; 
            font-size: 1.5rem; 
            color: var(--primary); 
            padding: 1.2rem;
            border-radius: 50%;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 25px var(--shadow-light);
        }
        .cart-icon:hover { 
            background: linear-gradient(135deg, var(--primary), var(--accent-gold));
            color: white;
            transform: translateY(-8px) rotateY(180deg) scale(1.1);
            box-shadow: 0 25px 50px var(--shadow-glow);
        }
        .badge { 
            position: absolute; 
            top: -5px; 
            right: -5px; 
            background: var(--accent-gold); 
            color: var(--primary);
            font-size: 0.75rem; 
            min-width: 24px; 
            height: 24px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 800;
            animation: pulse 2s infinite;
            box-shadow: 0 4px 12px rgba(198,166,100,0.4);
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* === HERO === */
        .hero { 
            height: 100vh; 
            background: 
                linear-gradient(135deg, rgba(15,61,46,0.6), rgba(198,166,100,0.3)),
                url('demo.jpg') center/cover no-repeat fixed;
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            color: white;
            transform-style: preserve-3d;
        }
        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(198,166,100,0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(15,61,46,0.4) 0%, transparent 50%);
            animation: heroFloat 20s ease-in-out infinite;
        }
        @keyframes heroFloat {
            0%, 100% { transform: translateY(0px) rotateZ(0deg); }
            33% { transform: translateY(-30px) rotateZ(1deg); }
            66% { transform: translateY(20px) rotateZ(-1deg); }
        }
        .hero-overlay {
            position: absolute; 
            inset: 0; 
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(2px);
        }
        .hero-text { 
            z-index: 10; 
            padding: 0 3rem;
            transform: translateZ(50px);
            animation: heroSlideIn 1.5s 0.8s ease-out forwards;
            opacity: 0;
        }
        @keyframes heroSlideIn {
            to { 
                opacity: 1;
                transform: translateZ(50px) translateY(0);
            }
        }
        .hero-text p { 
            letter-spacing: 8px; 
            font-size: 1.2rem; 
            margin-bottom: 2rem; 
            font-weight: 600; 
            text-transform: uppercase;
            text-shadow: 3px 3px 20px rgba(0,0,0,0.8);
            animation: textGlow 3s ease-in-out infinite alternate;
        }
        @keyframes textGlow {
            0% { text-shadow: 3px 3px 20px rgba(0,0,0,0.8), 0 0 30px var(--accent-gold); }
            100% { text-shadow: 3px 3px 20px rgba(0,0,0,0.8), 0 0 50px var(--accent-gold); }
        }
        .hero-text h1 { 
            font-family: var(--font-display); 
            font-size: clamp(4rem, 10vw, 7rem); 
            letter-spacing: 8px; 
            line-height: 1.1;
            text-shadow: 4px 4px 30px rgba(0,0,0,0.9);
            background: linear-gradient(135deg, var(--white), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* === SIZE CHART === */
        .size-chart-section {
            padding: 8rem 5%; 
            background: linear-gradient(135deg, rgba(245,231,201,0.6), rgba(238,224,196,0.4));
            margin: 4rem 0;
            position: relative;
            overflow: hidden;
        }
        .size-chart-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(198,166,100,0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        .size-chart-title {
            font-family: var(--font-display); 
            font-size: 3.5rem; 
            letter-spacing: 4px;
            text-align: center; 
            margin-bottom: 2rem; 
            color: var(--primary);
            background: linear-gradient(135deg, var(--primary), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            animation: titleFloat 6s ease-in-out infinite;
        }
        @keyframes titleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .size-chart-note { 
            font-size: 1.1rem; 
            text-align: center; 
            margin-bottom: 4rem; 
            color: #555;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .size-chart-table {
            width: 100%; 
            max-width: 900px; 
            margin: 0 auto; 
            border-collapse: collapse;
            font-size: 1rem; 
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 25px; 
            overflow: hidden;
            box-shadow: 0 25px 60px var(--shadow-medium);
            transform-style: preserve-3d;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .size-chart-table:hover {
            transform: translateY(-15px) rotateX(5deg);
            box-shadow: 0 40px 80px var(--shadow-glow);
        }
        .size-chart-table th, .size-chart-table td {
            border: 3px solid #e8d9c2; 
            padding: 1.5rem 1.5rem; 
            text-align: center;
            transition: all 0.3s ease;
        }
        .size-chart-table th { 
            background: linear-gradient(135deg, var(--primary), #0a2a20); 
            color: white; 
            font-weight: 800;
            font-size: 1.2rem;
            position: relative;
        }
        .size-chart-table tr:hover td {
            background: linear-gradient(135deg, rgba(198,166,100,0.1), transparent);
            transform: scale(1.02);
        }

        /* === PRODUCTS GRID === */
        .container { 
            padding: 8rem 5%; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); 
            gap: 4rem; 
        }
        .card { 
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            padding: 2.5rem 2rem;
            border-radius: 30px; 
            box-shadow: 0 20px 60px var(--shadow-light);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent-gold), var(--primary));
            transform: scaleX(0);
            transition: transform 0.6s ease;
        }
        .card:hover::before { transform: scaleX(1); }
        .card:hover { 
            transform: translateY(-25px) rotateX(8deg) rotateY(5deg) scale(1.02);
            box-shadow: 0 40px 100px var(--shadow-glow);
        }
        .img-box { 
            height: 380px; 
            background: linear-gradient(45deg, #f8f8f8, #f0f0f0); 
            margin-bottom: 2rem; 
            border-radius: 25px; 
            overflow: hidden;
            position: relative;
            transform-style: preserve-3d;
        }
        .img-box::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(198,166,100,0.1) 50%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .card:hover .img-box::after { opacity: 1; }
        .img-box img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: scale(1) rotateY(0deg);
        }
        .card:hover .img-box img { 
            transform: scale(1.15) rotateY(10deg);
        }

        .product-name { 
            font-weight: 800; 
            font-size: 1.3rem; 
            margin-bottom: 1rem; 
            color: #222;
            letter-spacing: 1px;
        }
        .price { 
            color: var(--primary); 
            font-weight: 900; 
            font-size: 2rem; 
            margin: 1.5rem 0;
            text-shadow: 2px 2px 10px var(--shadow-glow);
        }
        .sizes { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 1rem; 
            margin-bottom: 2.5rem; 
        }
        .s-btn { 
            width: 55px; 
            height: 45px; 
            border: 3px solid #e0e0e0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            font-size: 0.95rem; 
            font-weight: 800; 
            border-radius: 15px; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: white;
            position: relative;
            overflow: hidden;
        }
        .s-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, var(--accent-gold), transparent);
            transition: all 0.4s ease;
            transform: translate(-50%, -50%);
        }
        .s-btn:hover::before, .s-btn.active::before {
            width: 200%;
            height: 200%;
        }
        .s-btn:hover, .s-btn.active { 
            background: linear-gradient(135deg, var(--primary), var(--accent-gold)); 
            color: white; 
            border-color: var(--primary);
            transform: translateY(-6px) scale(1.15) rotateZ(5deg);
            box-shadow: 0 15px 35px var(--shadow-glow);
        }

        .add-btn { 
            width: 100%; 
            padding: 1.5rem 2rem; 
            background: linear-gradient(135deg, var(--primary), #0a2a20); 
            color: white; 
            border: none; 
            font-weight: 800; 
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            border-radius: 20px;
            font-size: 1.1rem;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .add-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s;
        }
        .add-btn:hover::before { left: 100%; }
        .add-btn:hover { 
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 25px 50px var(--shadow-glow);
        }
        .add-btn:active {
            transform: translateY(-4px) scale(1.02);
        }

        /* === CART SIDEBAR === */
        .sidebar { 
            position: fixed; 
            top: 0; 
            right: -500px; 
            width: 500px; 
            height: 100vh; 
            background: rgba(255,255,255,0.98);
            backdrop-filter: blur(30px);
            z-index: 2000; 
            transition: right 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex; 
            flex-direction: column; 
            box-shadow: -20px 0 60px var(--shadow-medium);
            transform-style: preserve-3d;
        }
        .sidebar.open { 
            right: 0;
            transform: rotateY(0deg);
        }
        .overlay { 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.7); 
            z-index: 1999; 
            display: none; 
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
        }
        .overlay.show { display: block; }
        .cart-header { 
            padding: 3rem 2.5rem; 
            border-bottom: 4px solid rgba(15,61,46,0.1);
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            background: linear-gradient(135deg, rgba(238,224,196,0.8), rgba(255,255,255,0.9));
            backdrop-filter: blur(20px);
        }
        .cart-items { 
            flex: 1; 
            overflow-y: auto; 
            padding: 2.5rem; 
            padding-bottom: 2rem;
        }
        .cart-footer { 
            padding: 3rem 2.5rem; 
            background: linear-gradient(135deg, rgba(248,248,248,0.9), rgba(240,240,240,0.9)); 
            border-top: 4px solid var(--bg-cream);
        }

        .qty-ctrl { 
            display: flex; 
            align-items: center; 
            gap: 1rem; 
            margin-top: 1rem; 
        }
        .qty-ctrl button { 
            width: 45px; 
            height: 45px; 
            border: 3px solid #ddd; 
            background: white; 
            cursor: pointer; 
            font-weight: 900; 
            font-size: 1.4rem;
            border-radius: 50%; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        .qty-ctrl button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, var(--accent-gold), transparent);
            transition: all 0.3s ease;
            transform: translate(-50%, -50%);
        }
        .qty-ctrl button:hover::before {
            width: 150%;
            height: 150%;
        }
        .qty-ctrl button:hover { 
            border-color: var(--primary); 
            background: var(--primary); 
            color: white;
            transform: scale(1.2) rotateZ(180deg);
            box-shadow: 0 10px 25px var(--shadow-glow);
        }

        /* === MODALS === */
        .modal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.85); 
            z-index: 3000; 
            align-items: center; 
            justify-content: center; 
            padding: 2rem;
            backdrop-filter: blur(20px);
        }
        .modal.show { display: flex; animation: modalSlideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes modalSlideIn {
            0% { opacity: 0; transform: scale(0.7) rotateX(-20deg); }
            100% { opacity: 1; transform: scale(1) rotateX(0deg); }
        }
        .modal-box { 
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(30px);
            width: 100%; 
            max-width: 600px; 
            padding: 4rem; 
            position: relative; 
            border-radius: 30px; 
            overflow-y: auto; 
            max-height: 90vh; 
            box-shadow: 0 40px 100px rgba(0,0,0,0.4);
            transform-style: preserve-3d;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .modal-box::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 30px;
            padding: 2px;
            background: linear-gradient(45deg, var(--primary), var(--accent-gold), var(--primary));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .modal.show .modal-box::before { opacity: 1; }

        /* === RESPONSIVE === */
        @media (max-width: 768px) { 
            .sidebar { width: 100vw; right: -100vw; }
            .hero-text h1 { font-size: 3.5rem; }
            .container { 
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
                padding: 4rem 2rem; 
                gap: 2rem;
            }
        }

        /* Additional animations for admin, payment, etc. can be added similarly */
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading" id="loading">
        <div class="loader"></div>
    </div>

    <!-- Rest of your existing HTML structure remains the same -->
    <!-- [Include all your existing HTML content here - admin panel, header, hero, products, cart, modals, footer] -->

    <script>
        // Hide loading screen
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 1500);
        });

        // Your existing JavaScript code remains the same
        // [Include all your existing JS functions here]
    </script>
</body>
</html>
