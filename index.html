<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOSE | Timeless Elegance, Modern Legacy</title>
    
    <!-- Fonts & CDN Libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Essential Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        :root {
            --primary: #0f3d2e;
            --accent-gold: #c6a664;
            --bg-cream: #EEE0C4;
            --white: #ffffff;
            --shadow-light: rgba(0,0,0,0.08);
            --shadow-medium: rgba(0,0,0,0.15);
            --font-main: 'Montserrat', sans-serif;
            --font-display: 'Playfair Display', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: var(--font-main);
            background: linear-gradient(135deg, var(--bg-cream) 0%, #f8f4e6 100%);
            color: #2c2c2c;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* === HEADER === */
        .header {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
            padding: 1rem 5%; box-shadow: 0 4px 30px var(--shadow-light);
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo-area { display: flex; align-items: center; gap: 1rem; }
        .logo-area img { height: 50px; border-radius: 12px; object-fit: cover; }
        .logo-text {
            font-family: var(--font-display); font-size: 2rem; font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent-gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .nav-actions { display: flex; gap: 1.5rem; align-items: center; }
        .btn-secondary, .btn-admin {
            padding: 0.6rem 1.5rem; border: 2px solid var(--primary); border-radius: 50px;
            background: transparent; color: var(--primary); font-weight: 600; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-size: 0.85rem; text-transform: uppercase;
        }
        .btn-secondary:hover, .btn-admin:hover:not(:disabled) {
            background: var(--primary); color: white; transform: translateY(-2px);
        }
        .btn-admin { display: none !important; opacity: 0; }
        .btn-admin.show { display: inline-flex !important; opacity: 1; }

        .cart-btn {
            position: relative; padding: 0.8rem; border-radius: 50%; cursor: pointer;
            transition: all 0.3s; font-size: 1.4rem; color: var(--primary);
        }
        .cart-btn:hover { background: rgba(15,61,46,0.1); transform: scale(1.1); }
        .cart-badge {
            position: absolute; top: -0.3rem; right: -0.3rem;
            background: var(--primary); color: white; border-radius: 50%;
            width: 22px; height: 22px; font-size: 0.75rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
        }

        /* === HERO === */
        .hero {
            height: 80vh; background: url('demo.jpg') center/cover;
            position: relative; display: flex; align-items: center; justify-content: center;
            text-align: center; color: white;
        }
        .hero::before {
            content: ''; position: absolute; inset: 0;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(2px);
        }
        .hero-content { position: relative; z-index: 2; padding: 0 2rem; }
        .hero-subtitle {
            font-size: 1.1rem; letter-spacing: 6px; margin-bottom: 1.5rem;
            text-transform: uppercase; opacity: 0.95;
        }
        .hero-title {
            font-family: var(--font-display); font-size: clamp(3.5rem, 10vw, 6.5rem);
            font-weight: 700; letter-spacing: 4px; line-height: 1.1; text-shadow: 3px 3px 10px rgba(0,0,0,0.5);
        }

        /* === SIZE CHART === */
        .size-guide {
            padding: 5rem 5%; background: rgba(248,244,230,0.8);
            text-align: center;
        }
        .size-title {
            font-family: var(--font-display); font-size: 2.5rem; color: var(--primary);
            margin-bottom: 1rem; letter-spacing: 2px;
        }
        .size-note {
            max-width: 600px; margin: 0 auto 3rem; color: #666; font-size: 1.05rem;
            line-height: 1.6;
        }
        .size-table {
            max-width: 900px; margin: 0 auto; background: white;
            border-radius: 20px; overflow: hidden; box-shadow: 0 20px 60px var(--shadow-medium);
            border-collapse: collapse;
        }
        .size-table th {
            background: linear-gradient(135deg, var(--primary), #0a2a1f);
            color: white; padding: 1.5rem 1rem; font-weight: 700; font-size: 1.1rem;
        }
        .size-table td { padding: 1.2rem 1rem; border-bottom: 1px solid #f0f0f0; font-weight: 600; }
        .size-table tr:hover td { background: #f8f8f8; }

        /* === PRODUCTS === */
        .products-grid {
            padding: 6rem 5%; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 3rem;
        }
        .product-card {
            background: white; border-radius: 24px; overflow: hidden;
            box-shadow: 0 15px 50px var(--shadow-light);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .product-card:hover {
            transform: translateY(-20px); box-shadow: 0 35px 80px var(--shadow-medium);
        }
        .product-image {
            height: 380px; position: relative; overflow: hidden;
        }
        .product-image img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.6s ease;
        }
        .product-card:hover .product-image img { transform: scale(1.1); }
        
        .product-info { padding: 2rem; }
        .product-name {
            font-size: 1.15rem; font-weight: 700; margin-bottom: 0.8rem;
            color: #333; line-height: 1.4;
        }
        .product-price {
            font-size: 1.6rem; font-weight: 800; color: var(--primary);
            margin-bottom: 1.5rem;
        }
        .size-selector {
            display: flex; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 1.8rem;
        }
        .size-btn {
            width: 52px; height: 44px; border: 2px solid #e5e5e5;
            border-radius: 12px; display: flex; align-items: center;
            justify-content: center; font-weight: 700; font-size: 0.9rem;
            cursor: pointer; transition: all 0.3s; background: white;
        }
        .size-btn:hover, .size-btn.active {
            border-color: var(--primary); background: var(--primary); color: white;
            transform: scale(1.05);
        }
        .add-to-cart {
            width: 100%; padding: 1.2rem 2rem; background: linear-gradient(135deg, var(--primary), #0a2a1f);
            color: white; border: none; border-radius: 16px; font-weight: 700;
            font-size: 1rem; cursor: pointer; text-transform: uppercase;
            letter-spacing: 1px; transition: all 0.3s;
        }
        .add-to-cart:hover:not(:disabled) {
            transform: translateY(-3px); box-shadow: 0 20px 40px rgba(15,61,46,0.4);
        }
        .add-to-cart:disabled { opacity: 0.6; cursor: not-allowed; }

        /* === CART SIDEBAR === */
        .cart-sidebar {
            position: fixed; top: 0; right: -500px; width: 500px; height: 100vh;
            background: white; z-index: 2000; transition: right 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: -15px 0 50px var(--shadow-medium);
        }
        .cart-sidebar.open { right: 0; }
        .cart-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            z-index: 1999; display: none; backdrop-filter: blur(8px);
        }
        .cart-header {
            padding: 2rem; border-bottom: 3px solid #f8f8f8;
            display: flex; justify-content: space-between; align-items: center;
        }
        .cart-title { font-size: 1.6rem; font-weight: 700; color: var(--primary); }
        .cart-close { font-size: 1.8rem; cursor: pointer; color: #999; }
        .cart-items { flex: 1; overflow-y: auto; padding: 2rem; }
        .cart-item {
            display: flex; gap: 1.5rem; padding: 1.5rem 0; border-bottom: 2px solid #f5f5f5;
        }
        .cart-item-image { width: 80px; height: 90px; border-radius: 12px; object-fit: cover; }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-weight: 700; margin-bottom: 0.5rem; }
        .cart-item-details { color: #666; font-size: 0.95rem; margin-bottom: 1rem; }
        .qty-controls {
            display: flex; align-items: center; gap: 1rem; margin: 0.8rem 0;
        }
        .qty-btn {
            width: 36px; height: 36px; border: 2px solid #ddd; border-radius: 50%;
            background: white; cursor: pointer; font-weight: 800; font-size: 1.2rem;
            transition: all 0.3s;
        }
        .qty-btn:hover { border-color: var(--primary); background: var(--primary); color: white; }
        .cart-item-total { font-weight: 800; font-size: 1.2rem; color: var(--primary); }
        
        .cart-footer {
            padding: 2.5rem; background: linear-gradient(135deg, #f8f8f8, #f0f0f0);
            border-top: 4px solid var(--bg-cream);
        }
        .cart-total-row {
            display: flex; justify-content: space-between; margin-bottom: 2rem;
            font-size: 1.4rem; font-weight: 800; color: var(--primary);
        }
        .checkout-btn {
            width: 100%; padding: 1.5rem; background: linear-gradient(135deg, var(--primary), #0a2a1f);
            color: white; border: none; border-radius: 16px; font-weight: 700; font-size: 1.1rem;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
        }
        .checkout-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* === MODALS === */
        .modal {
            display: none; position: fixed; inset: 0; z-index: 3000;
            align-items: center; justify-content: center; padding: 2rem;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
        }
        .modal-content {
            background: white; max-width: 550px; width: 100%; border-radius: 24px;
            padding: 3rem; max-height: 90vh; overflow-y: auto;
            box-shadow: 0 30px 100px rgba(0,0,0,0.4);
        }
        .modal-close {
            position: absolute; top: 1.5rem; right: 2rem; font-size: 2rem;
            cursor: pointer; color: #999; transition: color 0.3s;
        }
        .modal-close:hover { color: var(--primary); }
        .form-group { margin-bottom: 2rem; }
        .form-input, .form-textarea {
            width: 100%; padding: 1.2rem 1.5rem; border: 2px solid #e8e8e8;
            border-radius: 16px; font-size: 1rem; font-family: var(--font-main);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .form-input:focus, .form-textarea:focus {
            outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(15,61,46,0.1);
        }
        .form-textarea { resize: vertical; min-height: 120px; }

        .payment-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem; margin: 2.5rem 0;
        }
        .payment-option {
            display: flex; align-items: center; gap: 1rem; padding: 1.8rem;
            border: 3px solid #e8e8e8; border-radius: 20px; text-decoration: none;
            color: #333; font-weight: 700; font-size: 1.1rem; transition: all 0.3s;
            background: white; box-shadow: 0 8px 25px var(--shadow-light);
        }
        .payment-option:hover {
            transform: translateY(-8px); border-color: var(--primary);
            box-shadow: 0 20px 45px var(--shadow-medium);
        }
        .payment-icon { font-size: 2rem; }

        .confirm-btn {
            width: 100%; padding: 1.5rem; background: linear-gradient(135deg, #25D366, #128C7E);
            color: white; border: none; border-radius: 16px; font-weight: 700;
            font-size: 1.1rem; cursor: pointer; margin-top: 1.5rem;
        }
        .confirm-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .success-modal .modal-content {
            text-align: center; max-width: 500px;
        }
        .success-icon {
            font-size: 6rem; color: #4CAF50; margin-bottom: 2rem;
        }
        .success-title { font-family: var(--font-display); font-size: 2.5rem; color: var(--primary); margin-bottom: 1rem; }

        /* === ADMIN PANEL === */
        .admin-panel {
            position: fixed; inset: 0; z-index: 5000; background: rgba(0,0,0,0.95);
            display: none; flex-direction: column;
        }
        .admin-panel.active { display: flex; }
        .admin-login {
            background: white; max-width: 500px; margin: auto; padding: 4rem;
            border-radius: 24px; text-align: center; box-shadow: 0 40px 120px rgba(0,0,0,0.5);
        }
        .admin-stats {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem; margin: 3rem 0;
        }
        .stat-card {
            background: white; padding: 2.5rem; border-radius: 20px; text-align: center;
            box-shadow: 0 15px 50px var(--shadow-light);
        }
        .stat-number { font-size: 3rem; font-weight: 800; margin-bottom: 1rem; }
        .orders-table {
            background: white; border-radius: 20px; overflow: hidden;
            box-shadow: 0 20px 60px var(--shadow-light); margin-top: 2rem;
        }
        .orders-table th {
            background: linear-gradient(135deg, var(--primary), #0a2a1f);
            color: white; padding: 1.5rem; font-weight: 700;
        }
        .orders-table td { padding: 1.5rem; border-bottom: 1px solid #f0f0f0; }
        .status-badge {
            padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.85rem;
            font-weight: 700; text-transform: uppercase;
        }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-confirmed { background: #d4edda; color: #155724; }
        .status-shipped { background: #cce5ff; color: #004085; }
        .status-delivered { background: #f8d7da; color: #721c24; }

        /* === FOOTER === */
        .footer {
            background: linear-gradient(135deg, #1a1a1a, #0f0f0f);
            color: white; padding: 4rem 5% 2rem; text-align: center;
        }
        .social-links {
            display: flex; justify-content: center; gap: 2rem; margin-bottom: 2.5rem;
        }
        .social-link {
            width: 70px; height: 70px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-size: 1.8rem;
            color: white; text-decoration: none; border: 2px solid rgba(255,255,255,0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1);
        }
        .social-link:hover {
            transform: translateY(-12px) scale(1.1);
            border-color: var(--accent-gold); background: var(--accent-gold);
            box-shadow: 0 20px 40px rgba(198,166,100,0.4);
        }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            .products-grid { grid-template-columns: 1fr; padding: 3rem 2rem; gap: 2rem; }
            .cart-sidebar { width: 100vw; right: -100vw; }
            .hero { height: 70vh; }
            .hero-title { font-size: 3rem; }
            .payment-grid { grid-template-columns: 1fr; }
            .admin-stats { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <!-- ADMIN PAN
